<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📜 Lorem Ipsum 생성기</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 650px;
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
        }

        /* Control Box */
        .control-box {
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .char-count-badge {
            background-color: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #cbd5e1;
            outline: none;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .preset-btns {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .preset-btn {
            flex: 1;
            padding: 6px 12px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 60px;
        }

        .preset-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Output Box */
        .output-box {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            background-color: #fafafa;
            color: #334155;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary-color);
            background-color: #ffffff;
        }

        .btn-copy {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📜 Lorem Ipsum 생성기</h1>
        <p class="subtitle">원하는 글자 수만큼 더미 텍스트를 실시간으로 생성하세요.</p>

        <div class="control-box">
            <div class="slider-header">
                <span>글자 수 조절</span>
                <span class="char-count-badge" id="countDisplay">150 자</span>
            </div>
            <input type="range" id="lengthSlider" min="10" max="5000" value="150" step="1">

            <div class="preset-btns">
                <button class="preset-btn" onclick="setLength(50)">50자</button>
                <button class="preset-btn" onclick="setLength(150)">150자</button>
                <button class="preset-btn" onclick="setLength(500)">500자</button>
                <button class="preset-btn" onclick="setLength(1000)">1000자</button>
                <button class="preset-btn" onclick="setLength(5000)">5000자</button>
            </div>
        </div>

        <div class="output-box">
            <textarea id="loremOutput" readonly></textarea>
            <button class="btn-copy" id="copyBtn">📋 텍스트 복사하기</button>
        </div>
    </div>

    <script>
        const slider = document.getElementById('lengthSlider');
        const countDisplay = document.getElementById('countDisplay');
        const loremOutput = document.getElementById('loremOutput');
        const copyBtn = document.getElementById('copyBtn');

        // 기본 Lorem 단어 사전
        const words = [
            "lorem", "ipsum", "dolor", "sit", "amet", "consectetur", "adipiscing", "elit",
            "sed", "do", "eiusmod", "tempor", "incididunt", "ut", "labore", "et", "dolore",
            "magna", "aliqua", "ut", "enim", "ad", "minim", "veniam", "quis", "nostrud",
            "exercitation", "ullamco", "laboris", "nisi", "ut", "aliquip", "ex", "ea",
            "commodo", "consequat", "duis", "aute", "irure", "dolor", "in", "reprehenderit",
            "in", "voluptate", "velit", "esse", "cillum", "dolore", "eu", "fugiat", "nulla",
            "pariatur", "excepteur", "sint", "occaecat", "cupidatat", "non", "proident",
            "sunt", "in", "culpa", "qui", "officia", "deserunt", "mollit", "anim", "id", "est", "laborum"
        ];

        // 원하는 글자 수만큼 Lorem Ipsum 생성 함수
        function generateLorem(targetLength) {
            let result = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. ";
            let wordIndex = 0;

            while (result.length < targetLength) {
                let word = words[wordIndex % words.length];
                result += word + " ";
                
                // 약 10~12단어마다 문장 마침표 추가
                if ((wordIndex + 1) % 11 === 0) {
                    result = result.trim() + ". ";
                }
                wordIndex++;
            }

            // 정확히 지정된 글자 수만큼 자르기
            return result.substring(0, targetLength);
        }

        // 화면 업데이트 함수
        function updateText() {
            const length = parseInt(slider.value);
            countDisplay.textContent = `${length.toLocaleString()} 자`;
            loremOutput.value = generateLorem(length);
        }

        // 프리셋 버튼 동작 함수
        function setLength(val) {
            slider.value = val;
            updateText();
        }

        // 이벤트 바인딩
        slider.addEventListener('input', updateText);

        copyBtn.addEventListener('click', () => {
            loremOutput.select();
            navigator.clipboard.writeText(loremOutput.value).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ 복사 완료!';
                copyBtn.style.backgroundColor = '#10b981';

                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.style.backgroundColor = 'var(--primary-color)';
                }, 1500);
            });
        });

        // 초기 실행 (150자 생성)
        updateText();
    </script>
</body>
</html>
