<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ BMI & 목표 체중 계산기</title>
    <style>
        :root {
            --primary-color: #10b981;
            --primary-hover: #059669;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 550px;
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
        }

        .gender-select {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .gender-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .gender-btn.active {
            border-color: var(--primary-color);
            background-color: #ecfdf5;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .btn-calc {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-calc:hover {
            background-color: var(--primary-hover);
        }

        /* Result Section */
        .result-container {
            display: none;
            margin-top: 28px;
            animation: fadeIn 0.4s ease;
        }

        .bmi-badge-box {
            text-align: center;
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .bmi-value {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .bmi-status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Standard Cards */
        .target-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #334155;
        }

        .target-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .target-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
        }

        .target-label {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .target-label span {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: normal;
            display: block;
        }

        .target-diff {
            font-size: 1rem;
            font-weight: 800;
        }

        .diff-plus { color: #ef4444; }  /* 증량 필요 */
        .diff-minus { color: #3b82f6; } /* 감량 필요 */
        .diff-zero { color: #10b981; }  /* 유지 */

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚖️ BMI & 목표 체중 계산기</h1>
        <p class="subtitle">나의 체질량지수와 BMI 기준별 목표 체중을 확인하세요.</p>

        <form id="bmiForm">
            <div class="gender-select">
                <button type="button" class="gender-btn active" id="btnMale" onclick="selectGender('male')">👨 남성</button>
                <button type="button" class="gender-btn" id="btnFemale" onclick="selectGender('female')">👩 여성</button>
            </div>

            <div class="form-group">
                <label for="height">신장 (cm)</label>
                <input type="number" id="height" placeholder="예: 175" step="0.1" required>
            </div>

            <div class="form-group">
                <label for="weight">체중 (kg)</label>
                <input type="number" id="weight" placeholder="예: 70" step="0.1" required>
            </div>

            <button type="submit" class="btn-calc">BMI 및 목표 체중 계산</button>
        </form>

        <div class="result-container" id="resultContainer">
            <div class="bmi-badge-box">
                <div class="bmi-value" id="bmiValue">00.0</div>
                <div class="bmi-status" id="bmiStatus">정상</div>
            </div>

            <div class="target-title">🎯 BMI 기준별 목표 체중 조절량</div>

            <div class="target-grid">
                <!-- 90% 기준 -->
                <div class="target-card">
                    <div class="target-label">
                        BMI 90% (슬림/미용)
                        <span id="targetWeight90">목표 00.0 kg</span>
                    </div>
                    <div class="target-diff" id="diff90">-</div>
                </div>

                <!-- 100% 기준 -->
                <div class="target-card" style="border-color: #10b981; background-color: #f0fdf4;">
                    <div class="target-label">
                        BMI 100% (표준 체중)
                        <span id="targetWeight100">목표 00.0 kg</span>
                    </div>
                    <div class="target-diff" id="diff100">-</div>
                </div>

                <!-- 110% 기준 -->
                <div class="target-card">
                    <div class="target-label">
                        BMI 110% (과체중 경계)
                        <span id="targetWeight110">목표 00.0 kg</span>
                    </div>
                    <div class="target-diff" id="diff110">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedGender = 'male';

        function selectGender(gender) {
            selectedGender = gender;
            document.getElementById('btnMale').classList.toggle('active', gender === 'male');
            document.getElementById('btnFemale').classList.toggle('active', gender === 'female');
        }

        const bmiForm = document.getElementById('bmiForm');
        const resultContainer = document.getElementById('resultContainer');

        bmiForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const heightCm = parseFloat(document.getElementById('height').value);
            const weightKg = parseFloat(document.getElementById('weight').value);

            if (!heightCm || !weightKg) return;

            const heightM = heightCm / 100;
            const bmi = weightKg / (heightM * heightM);

            // 1. BMI 결과 및 판정 (대한비만학회 기준)
            const bmiValueEl = document.getElementById('bmiValue');
            const bmiStatusEl = document.getElementById('bmiStatus');

            bmiValueEl.textContent = bmi.toFixed(1);

            let statusText = '';
            let statusColor = '';

            if (bmi < 18.5) {
                statusText = '저체중';
                statusColor = '#3b82f6';
            } else if (bmi < 23) {
                statusText = '정상';
                statusColor = '#10b981';
            } else if (bmi < 25) {
                statusText = '비만전단계 (과체중)';
                statusColor = '#f59e0b';
            } else if (bmi < 30) {
                statusText = '1단계 비만';
                statusColor = '#ef4444';
            } else {
                statusText = '2단계/고도 비만';
                statusColor = '#b91c1c';
            }

            bmiStatusEl.textContent = statusText;
            bmiStatusEl.style.backgroundColor = statusColor;

            // 2. 표준 체중 및 90%, 100%, 110% 목표 체중 계산
            // 표준 BMI 기준: 남성 22, 여성 21 적용
            const stdBmi = (selectedGender === 'male') ? 22 : 21;
            const standardWeight = stdBmi * (heightM * heightM); // 100% 기준 체중

            const weight100 = standardWeight;
            const weight90 = standardWeight * 0.9;
            const weight110 = standardWeight * 1.1;

            // 3. 차이 계산 및 UI 출력 함수
            function renderDiff(targetWeight, targetWeightElId, diffElId) {
                const diff = targetWeight - weightKg; // 목표 - 현재
                const targetWeightEl = document.getElementById(targetWeightElId);
                const diffEl = document.getElementById(diffElId);

                targetWeightEl.textContent = `목표 ${targetWeight.toFixed(1)} kg`;

                if (Math.abs(diff) < 0.1) {
                    diffEl.textContent = '현재 도달!';
                    diffEl.className = 'target-diff diff-zero';
                } else if (diff < 0) {
                    diffEl.textContent = `${Math.abs(diff).toFixed(1)} kg 감량`;
                    diffEl.className = 'target-diff diff-minus';
                } else {
                    diffEl.textContent = `${diff.toFixed(1)} kg 증량`;
                    diffEl.className = 'target-diff diff-plus';
                }
            }

            renderDiff(weight90, 'targetWeight90', 'diff90');
            renderDiff(weight100, 'targetWeight100', 'diff100');
            renderDiff(weight110, 'targetWeight110', 'diff110');

            resultContainer.style.display = 'block';
        });
    </script>
</body>
</html>
