                        "secondary-fixed": "#ffd9df",

                        "on-tertiary": "#ffffff",

                    },
                    "borderRadius": {

                    "spacing": {

<style>

            box-shadow: 0px 10px 30px rgba(45, 90, 246, 0.08);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md items-center justify-center">
<!-- Main Content -->
<main class="w-full flex items-center justify-center py-stack-lg px-gutter">
<div class="bg-surface-container-lowest rounded-xl custom-shadow max-w-[720px] w-full p-stack-md sm:p-margin-desktop relative overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- Survey Header -->
<div class="text-center mb-stack-lg relative z-10">
<div class="text-headline-md font-headline-md font-black text-primary mb-6">SeishunTravel</div>
<h1 class="font-headline-lg text-headline-lg md:hidden font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">일본 여행지 선정</h1>
<h1 class="hidden md:block font-headline-lg text-headline-lg text-on-surface mb-stack-sm">일본 여행지 선정</h1>
<p class="font-body-md text-body-md text-on-surface-variant">여러분의 완벽한 청춘 여행을 위한 첫 걸음입니다.</p>
</div>
<!-- Progress Bar -->
<div class="mb-stack-md relative z-10">
<div class="flex justify-between items-center mb-base">
<span class="font-label-sm text-label-sm text-primary">기본 정보</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Step 1 of 1</span>
</div>
<div class="h-3 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-tertiary-container to-primary w-full rounded-full"></div>
</div>
</div>
<!-- Form -->
<form class="space-y-stack-sm relative z-10">
<!-- Name Field -->
<div class="relative">
<input class="peer w-full h-14 bg-transparent text-on-surface font-body-md text-body-md border-2 border-outline-variant rounded-lg px-4 pt-4 pb-2 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all placeholder-transparent" id="name" name="name" placeholder="홍길동" required="" type="text"/>
<label class="absolute left-4 top-2 text-on-surface-variant font-label-sm text-label-sm transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-2 peer-focus:text-label-sm peer-focus:text-primary" for="name">이름</label>
</div>
<!-- Contact Field -->
<div class="relative">
<input class="peer w-full h-14 bg-transparent text-on-surface font-body-md text-body-md border-2 border-outline-variant rounded-lg px-4 pt-4 pb-2 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all placeholder-transparent" id="phone" name="phone" placeholder="010-0000-0000" required="" type="tel"/>
<label class="absolute left-4 top-2 text-on-surface-variant font-label-sm text-label-sm transition-all peer-placeholder-shown:top-4 peer-placeholder-shown:text-body-md peer-focus:top-2 peer-focus:text-label-sm peer-focus:text-primary" for="phone">연락처</label>
</div>
<!-- Destination Field -->
<div class="relative group">
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">expand_more</span>
</div>
<select class="peer w-full h-14 bg-transparent text-on-surface font-body-md text-body-md border-2 border-outline-variant rounded-lg px-4 pt-4 pb-2 appearance-none focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all pr-12" id="destination" name="destination" required=""><option disabled="" hidden="" selected="" value=""></option><option value="tokyo">1.도쿄</option><option value="osaka">2.오사카</option><option value="fukuoka">3.후쿠오카</option><option value="sapporo">4.삿포로</option><option value="kyoto">5.교토</option></select>
<label class="absolute left-4 top-2 text-on-surface-variant font-label-sm text-label-sm transition-all peer-focus:text-primary" for="destination">가고 싶은 여행지</label>
</div>
<!-- Action Buttons -->
<div class="pt-stack-md flex justify-end">
<button class="bg-primary text-on-primary font-label-md text-label-md py-3 px-8 rounded-full hover:bg-on-primary-fixed-variant hover:scale-[1.02] active:translate-y-[2px] transition-all custom-shadow flex items-center gap-2" onclick="handleFormSubmit(this)" type="button">
                        제출하기 <span class="material-symbols-outlined text-sm">send</span>
</button>
</div>
</form>
</div>
</main>
<script>
        // Simple micro-interaction for form inputs
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
<script>
function handleFormSubmit(button) {
    const form = button.closest('form');
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }

    const formData = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        destination: document.getElementById('destination').value
    };

    button.disabled = true;
    button.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> 처리 중...';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler(() => {
                showSuccessState(form);
            })
            .withFailureHandler((err) => {
                alert('오류가 발생했습니다: ' + err);
                button.disabled = false;
                button.innerHTML = '제출하기 <span class="material-symbols-outlined text-sm">send</span>';
            })
            .submitData(formData);
    } else {
        // Fallback for local testing
        console.log('Form Data:', formData);
        setTimeout(() => showSuccessState(form), 500);
    }
}

function showSuccessState(form) {
    form.innerHTML = `<div class='text-center py-8 animate-in fade-in zoom-in duration-500'>
        <div class='w-20 h-20 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-6'>
            <span class='material-symbols-outlined text-4xl' style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </div>
        <h2 class='text-headline-md font-headline-md text-on-surface mb-2'>입력되었습니다.</h2>
        <p class='text-body-lg text-on-surface-variant'>여행날 봐요~</p>
        <div class='mt-8'>
            <button onclick='window.location.reload()' class='text-primary font-label-md hover:underline'>다시 작성하기</button>
        </div>
    </div>`;
}
</script></body></html>
